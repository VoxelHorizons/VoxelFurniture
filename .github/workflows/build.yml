name: Build VoxelFurniture

on:
  push:
    branches: [main, 'feat/**', 'fix/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout VoxelFurniture
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Checkout VoxelCore dependency
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: VoxelHorizons/VoxelCore
          ref: 73b337ccbad41cbbae5a0573e4a30a7742539ba7 # Pinned VoxelCore commit; update through reviewed PR
          path: VoxelCore

      - name: Set up Java 25
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 25
          cache: maven

      - name: Install VoxelCore API
        run: mvn -B --no-transfer-progress -f VoxelCore/pom.xml install -DskipTests

      - name: Build and test VoxelFurniture
        run: mvn -B --no-transfer-progress clean verify

      - name: Upload universal plugin
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: VoxelFurniture-mc1.12-26.3
          path: target/VoxelFurniture-*.jar

